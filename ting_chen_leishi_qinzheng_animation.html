<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

THREE.ColorManagement.enabled = false;

/* ================================================================
   Utilities
================================================================ */
const TOTAL = 162;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const win=(t,a,b,f=1.5)=>smooth(a,a+f,t)*(1-smooth(b-f,b,t));
const wins=(t,list,f=1.5)=>{let m=0;for(const w of list)m=Math.max(m,win(t,w[0],w[1],w[2]??f));return m;};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const C=h=>new THREE.Color(h);
// motion time: freezes during the "急頓" moment (128–137s)
const motionTime=t=>t<128?t:(t<137?128:t-9);

/* ================================================================
   Renderer / scene / camera
================================================================ */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1d2a3a,0.004);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,3000);
camera.position.set(0,8,40);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.75,0.6,0.55);
composer.addPass(bloom);

const ambient=new THREE.AmbientLight(0x8090b0,0.6);scene.add(ambient);
const moonLight=new THREE.DirectionalLight(0xcfd8ff,0.8);moonLight.position.set(0,80,-300);scene.add(moonLight);
const warmLight=new THREE.PointLight(0xffc070,0,60,1);scene.add(warmLight);

/* ================================================================
   Canvas texture helpers
================================================================ */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function glowTex(r,g,b,core=1){return canvasTex(256,256,(x,w)=>{const gr=x.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,`rgba(${r},${g},${b},${core})`);gr.addColorStop(.18,`rgba(${r},${g},${b},${.55*core})`);
  gr.addColorStop(.45,`rgba(${r},${g},${b},.14)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,256,256);});}
const TEX={
  white:glowTex(255,255,255), gold:glowTex(255,214,140), cool:glowTex(190,215,255), red:glowTex(255,80,70),
  violet:glowTex(200,140,255), warm:glowTex(255,190,110),
};
TEX.moon=canvasTex(512,512,(x)=>{
  const g=x.createRadialGradient(256,256,0,256,256,256);
  g.addColorStop(0,'rgba(255,250,232,1)');g.addColorStop(.36,'rgba(250,244,222,1)');g.addColorStop(.40,'rgba(240,235,215,.55)');
  g.addColorStop(.55,'rgba(220,228,245,.18)');g.addColorStop(1,'rgba(200,215,240,0)');x.fillStyle=g;x.fillRect(0,0,512,512);
  const R=rng(3);x.globalCompositeOperation='multiply';
  for(let i=0;i<14;i++){const a=R()*6.28,d=R()*150,rr=12+R()*40;x.fillStyle=`rgba(200,195,180,${.15+R()*.2})`;
    x.beginPath();x.arc(256+Math.cos(a)*d,256+Math.sin(a)*d,rr,0,6.28);x.fill();}
});
TEX.cloud=canvasTex(512,256,(x)=>{const R=rng(11);
  for(let i=0;i<70;i++){const cx=60+R()*392,cy=90+R()*80,r=20+R()*70;const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,512,256);}});
TEX.leaf=canvasTex(64,64,(x)=>{x.translate(32,32);x.rotate(.7);x.fillStyle='#fff';x.beginPath();x.ellipse(0,0,8,26,0,0,6.28);x.fill();});
TEX.beam=canvasTex(64,512,(x)=>{const g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(.5,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;
  const h=x.createLinearGradient(0,0,64,0);x.fillRect(0,0,64,512);x.globalCompositeOperation='destination-in';
  h.addColorStop(0,'rgba(0,0,0,0)');h.addColorStop(.5,'rgba(0,0,0,1)');h.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=h;x.fillRect(0,0,64,512);});

// rice-paper overlay
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  x.fillStyle='#f2ead8';x.fillRect(0,0,256,256);const R=rng(5);const img=x.getImageData(0,0,256,256);
  for(let i=0;i<img.data.length;i+=4){const n=(R()-.5)*38;img.data[i]+=n;img.data[i+1]+=n;img.data[i+2]+=n;}x.putImageData(img,0,0);
  x.strokeStyle='rgba(120,100,70,.18)';for(let i=0;i<70;i++){x.lineWidth=.5+R();x.beginPath();const a=R()*256,b=R()*256;
    x.moveTo(a,b);x.quadraticCurveTo(a+R()*40-20,b+R()*40-20,a+R()*60-30,b+R()*60-30);x.stroke();}
  const p=document.getElementById('paper');p.style.backgroundImage=`url(${c.toDataURL()})`;p.style.backgroundColor='#f2ead8';})();

// ink / snow mountain ridge texture
function mountainTex(seed,o){
  return canvasTex(2048,512,(x,w,h)=>{
    const R=rng(seed);const N=1024;const y=new Float32Array(N+1);
    y[0]=R();y[N]=R();
    (function md(a,b,r){if(b-a<2)return;const m=(a+b)>>1;y[m]=(y[a]+y[b])/2+(R()-.5)*r;md(a,m,r*.56);md(m,b,r*.56);})(0,N,1.1);
    let mn=1e9,mx=-1e9;for(const v of y){mn=Math.min(mn,v);mx=Math.max(mx,v);}
    const pts=[];for(let i=0;i<=N;i++){let v=(y[i]-mn)/(mx-mn);const u=i/N;
      if(o.peak){v=v*.35+Math.pow(Math.max(0,1-Math.abs(u-.5)*2.3),1.6)*.95;}
      const top=h*(1-o.hi*v-o.lo);pts.push([u*w,Math.max(h*.04,top)]);}
    let minY=h;pts.forEach(p=>minY=Math.min(minY,p[1]));
    x.beginPath();x.moveTo(0,h);pts.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(w,h);x.closePath();
    const g=x.createLinearGradient(0,minY,0,h);
    o.stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fill();
    // texture strokes (cun fa)
    x.save();x.clip();
    for(let i=0;i<o.strokes;i++){const p=pts[Math.floor(R()*N)];const len=20+R()*120;
      x.strokeStyle=o.strokeCol.replace('A',(.05+R()*.18).toFixed(2));x.lineWidth=1+R()*3;
      x.beginPath();x.moveTo(p[0],p[1]+2);x.quadraticCurveTo(p[0]+(R()-.5)*30,p[1]+len*.5,p[0]+(R()-.5)*40,p[1]+len);x.stroke();}
    x.restore();
    x.strokeStyle=o.ridge;x.lineWidth=2;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
  });
}

/* ================================================================
   Fade registry
================================================================ */
const fades=[];
function regFade(obj,fn){const mats=[];obj.traverse(o=>{if(!o.material)return;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
  if(mats.includes(m))return;m.transparent=true;if(m.userData.base===undefined)m.userData.base=m.uniforms?.uOpacity?m.uniforms.uOpacity.value:m.opacity;mats.push(m);});});
  fades.push({obj,fn,mats});}
function applyFades(t){for(const f of fades){const o=f.fn(t);f.obj.visible=o>0.003;if(!f.obj.visible)continue;
  for(const m of f.mats){if(m.uniforms&&m.uniforms.uOpacity)m.uniforms.uOpacity.value=m.userData.base*o;else m.opacity=m.userData.base*o;}}}

/* ================================================================
   Sky dome
================================================================ */
const skyU={uTop:{value:C(0x05070f)},uMid:{value:C(0x0f1a2a)},uBot:{value:C(0x2a3442)}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 uTop,uMid,uBot;varying vec3 vD;void main(){float h=normalize(vD).y;
    vec3 c=mix(uBot,uMid,smoothstep(0.,.16,h));c=mix(c,uTop,smoothstep(.16,.75,h));gl_FragColor=vec4(c,1.);}`}));
sky.renderOrder=-10;scene.add(sky);
const SKY=[ // t, top, mid, bottom, fogDensity, ambient
 [0,0x04060c,0x0d1624,0x222c3a,.0022,.35],[9,0x05080f,0x121e30,0x2a3646,.002,.45],
 [12,0x0d1626,0x2e3c4c,0x66727a,.003,.6],[20,0x0b1322,0x26344a,0x4e5a68,.0026,.5],
 [24,0x03050c,0x0c1626,0x1d2a3a,.0018,.45],[52,0x03050c,0x0c1626,0x1d2a3a,.0018,.45],
 [56,0x020308,0x080e1c,0x161e34,.0014,.4],[66,0x020308,0x080e1c,0x161e34,.0014,.4],
 [71,0x0b1628,0x2a3d5a,0x6f88a8,.0015,.6],[78,0x0b1628,0x2a3d5a,0x6f88a8,.0015,.6],
 [82,0x1a1c22,0x48484a,0x857c6c,.004,.55],[91,0x1a1c22,0x48484a,0x857c6c,.004,.55],
 [95,0x0c0f14,0x232a31,0x3c444c,.003,.45],[101,0x0c0f14,0x232a31,0x3c444c,.003,.45],
 [106,0x2a3a6a,0xd5806a,0xf4c08a,.0018,.8],[109,0x2a3a6a,0xd5806a,0xf4c08a,.0018,.8],
 [112,0x2f62a6,0xa8c8e8,0xeef4fa,.0012,1.0],[124,0x2f62a6,0xa8c8e8,0xeef4fa,.0012,1.0],
 [127,0x0c1430,0x45567a,0xb8c6dc,.0011,.7],[136,0x0c1430,0x45567a,0xb8c6dc,.0011,.7],
 [140,0x02040a,0x0b1424,0x1e2c40,.0016,.45],[162,0x02040a,0x0b1424,0x1e2c40,.0016,.45]];
const _ca=new THREE.Color(),_cb=new THREE.Color();
function updateSky(t){let i=0;while(i<SKY.length-2&&t>SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1];const u=smooth(a[0],b[0],t);
  skyU.uTop.value.copy(_ca.set(a[1])).lerp(_cb.set(b[1]),u);skyU.uMid.value.copy(_ca.set(a[2])).lerp(_cb.set(b[2]),u);
  skyU.uBot.value.copy(_ca.set(a[3])).lerp(_cb.set(b[3]),u);scene.fog.color.copy(skyU.uBot.value);
  scene.fog.density=lerp(a[4],b[4],u);const amb=lerp(a[5],b[5],u);ambient.intensity=amb*Math.PI;moonLight.intensity=(.4+amb*.6)*Math.PI;}

/* ================================================================
   Lake / river / ice  (shader with ripples, rain, moon path)
================================================================ */
const RIP_N=12;
const waterU={uTime:{value:0},uRain:{value:0},uIce:{value:0},uGlow:{value:0},uMoon:{value:1},uMoonX:{value:0},
  uDeep:{value:C(0x060b14)},uSky:{value:C(0x2a3442)},uFog:{value:C(0x1d2a3a)},uFogD:{value:.004},
  uMoonCol:{value:C(0xfff2d6)},uRip:{value:Array.from({length:RIP_N},()=>new THREE.Vector4(0,0,-99,0))}};
const water=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400,1,1),new THREE.ShaderMaterial({uniforms:waterU,
  vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`
  uniform float uTime,uRain,uIce,uGlow,uMoon,uMoonX,uFogD;uniform vec3 uDeep,uSky,uFog,uMoonCol;uniform vec4 uRip[${RIP_N}];varying vec3 vW;
  float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  void main(){
    vec2 p=vW.xz;vec3 V=normalize(vW-cameraPosition);float dist=length(vW-cameraPosition);
    float fres=pow(1.-abs(V.y),4.);vec3 col=mix(uDeep,uSky,fres*.9);
    float r=0.;
    for(int i=0;i<${RIP_N};i++){vec4 R=uRip[i];float age=uTime-R.z;if(age>0.&&age<14.){float d=length(p-R.xy);float x=d-age*2.6;
      r+=R.w*sin(x*4.)*exp(-x*x*.35)*exp(-age*.32)/(1.+d*.12);}}
    if(uRain>0.){for(int k=0;k<2;k++){vec2 g=p*(.7+float(k)*.5)+float(k)*9.1;vec2 c=floor(g);vec2 f=fract(g)-.5;float ph=h21(c);
      float a=fract(uTime*1.1+ph);vec2 o=vec2(h21(c+3.1),h21(c+7.7))-.5;float d=length(f-o*.5);float x=d-a*.45;
      r+=uRain*sin(x*45.)*exp(-x*x*400.)*(1.-a)*.9;}}
    float w=1.2+max(0.,-p.y+10.)*.035;float sx=(p.x-uMoonX)/w;
    float streak=exp(-sx*sx)*smoothstep(25.,-40.,p.y);
    float sh=pow(.5+.5*sin(p.y*2.1+uTime*1.4+sin(p.x*1.7+uTime*.6)*2.+r*6.),3.);
    streak*=mix(.2,1.,sh);
    col+=uMoonCol*streak*uMoon*.75;
    col+=vec3(.55,.62,.75)*max(r,0.)*(.5+streak*2.)*(1.-uIce);
    col+=uMoonCol*.06*uGlow*(1.-fres*.5);
    vec3 ice=vec3(.80,.87,.95)*(.88+.12*h21(floor(p*.8)))-vec3(.1)*smoothstep(.97,1.,abs(sin(p.x*.13+sin(p.y*.21)*2.)));
    col=mix(col,ice*(.65+.35*fres),uIce);
    float fogF=1.-exp(-dist*dist*uFogD*uFogD);col=mix(col,uFog,fogF);
    gl_FragColor=vec4(col,1.);}`}));
water.rotation.x=-Math.PI/2;water.position.z=-300;scene.add(water);
// ripple events: [time, x, z, strength]
const RIPPLES=[[11,0,-90,1.0],[20.6,6,-26,1.5]];

/* ================================================================
   Moon, halo, stars / Milky Way
================================================================ */
const moon=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.moon,fog:false,depthWrite:false}));
moon.scale.set(70,70,1);moon.position.set(0,165,-520);scene.add(moon);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.cool,fog:false,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.35}));
halo.scale.set(330,330,1);halo.position.copy(moon.position);scene.add(halo);
const moonGroup=new THREE.Group();moonGroup.add(moon,halo);scene.add(moonGroup);

const STAR_N=7000;

  if(egret.visible){const u=smooth(11,20.6,t)*.97+clamp((t-20.6)/1,0,1)*.03;placeOnPath(egret,u2=>egretCurve.getPoint(u2),Math.min(u,.995));
    flap(egret,t*(u>.7?4:7),u>.75?.25:.9);}
  if(osm.visible){dews.forEach(d=>d.scale.setScalar(.85*smooth(d.userData.b,d.userData.b+2.5,t)*(1+.08*Math.sin(t*2+d.userData.b))));osm.rotation.z=Math.sin(mt*.6)*.004;}
  DROPS.forEach((d,i)=>{const s=dropSprites[i];const on=t>=d.start&&t<d.hit;s.visible=on;if(on){const a=t-d.start;s.position.set(d.x,d.y0-7.35*a*a,d.z);}});
  if(fragrance.visible)updateFragrance(mt);
  if(lotusGroup.visible)lotusGroup.children.forEach((l,i)=>{l.position.y=Math.sin(mt*.8+i)*.05;});
  if(windStreaks.visible)updateWind(mt);
  warmLight.position.copy(WIN_POS).addScaledVector(WIN_N,-4);warmLight.intensity=win(t,43,52,2)*40;
  if(strGroup.visible)strings.forEach((s,i)=>{const u=s.userData.u;u.uTime.value=t;u.uAge.value=t-lastPluck(i,t);u.uAmp.value=2.8;});
  if(hands.visible)updateHands(t);
  if(noteBirds.visible)updateNoteBirds(t);
  if(frost.visible)updateFrost(mt);
  windU.uT.value=mt;windU.uWind.value=.25+win(t,82,92,3)*1.1;
  if(fallLeaves.visible)updateLeaves(mt);
  if(geese.visible)updateGeese(t);
  if(rain.visible)updateRain(mt);
  if(swordGroup.visible)updateSwords(mt);
  if(petals.visible)updatePetals(t);
  if(snow.visible)updateSnow(mt);
  if(sun.visible){const u=Math.pow(smooth(112,116,t),2.2);sun.position.lerpVectors(V3(90,SUMMIT.y+140,PEAK_Z-120),CRY_POS,u);}
  if(crystal.visible){crystal.rotation.y=mt*.4;crystal.scale.setScalar(1+.04*Math.sin(mt*3));}
  if(shards.visible)updateShards(mt);
  if(ruby.visible){ruby.rotation.y=mt*.12;ruby.userData.neb.rotation.y=mt*.35;ruby.scale.setScalar(smooth(118,120.5,t));}
  if(ascend.visible)updateAscend(mt);
  const shimmer=win(t,146,TOTAL+5,3);palaceTiles.forEach(m=>m.emissive.setRGB(.04+.12*shimmer*(.6+.4*Math.sin(t*2)),.1+.18*shimmer,.14+.26*shimmer*(.6+.4*Math.sin(t*2+1))));
  // overlays
  flashEl.style.opacity=(Math.max(win(t,115.9,117.4,.15)*.9,win(t,127.95,129.6,.08),win(t,4.2,5.4,.2)*.15)).toFixed(3);
  blackEl.style.opacity=(1-smooth(0,2.5,t)*1+smooth(157,161,t)*.85).toFixed(3);
  endEl.style.opacity=smooth(156.5,159.5,t).toFixed(3);
  bloom.threshold=.55+win(t,106.5,126,2)*.33;bloom.strength=.75+win(t,115.5,118,.3)*.8+win(t,128,131,.2)*.9;
  updateSub(t);
  fillEl.style.width=(t/TOTAL*100)+'%';timeEl.textContent=`${fmt(t)} / ${fmt(TOTAL)}`;
  composer.render();}

function togglePlay(){if(T>=TOTAL){seek(0);}playing=!playing;playBtn.textContent=playing?'❚❚':'▶';audio.resume();}
document.getElementById('startBtn').onclick=()=>{audio.init();audio.resume();started=true;seek(0);playing=true;
  const intro=document.getElementById('intro');intro.style.opacity=0;setTimeout(()=>intro.remove(),1700);
  const ui=document.getElementById('ui');ui.classList.add('show');setTimeout(()=>ui.classList.remove('show'),3000);};
playBtn.onclick=togglePlay;
document.getElementById('bRe').onclick=()=>{seek(0);playing=true;playBtn.textContent='❚❚';};
document.getElementById('bSub').onclick=()=>{subOn=!subOn;};
document.getElementById('bMute').onclick=e=>{audio.muted=!audio.muted;e.target.textContent=audio.muted?'✕':'♪';};
document.getElementById('bFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
document.getElementById('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL);};
addEventListener('keydown',e=>{if(!started)return;if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.key==='r'||e.key==='R')document.getElementById('bRe').click();if(e.key==='s'||e.key==='S')subOn=!subOn;
  if(e.key==='m'||e.key==='M')document.getElementById('bMute').click();if(e.key==='f'||e.key==='F')document.getElementById('bFull').click();
  if(e.key==='ArrowRight')seek(T+5);if(e.key==='ArrowLeft')seek(T-5);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

// warm-up: compile shaders for all objects before showing the start button
fades.forEach(f=>f.obj.visible=true);renderer.compile(scene,camera);
seek(0);requestAnimationFrame(frame);
window.__qinReady=true;
const sb=document.getElementById('startBtn');sb.disabled=false;sb.textContent='開　始';
document.getElementById('loadMsg').textContent='建議戴上耳機・全螢幕觀賞';
</script>
